<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catatan Kerja</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f4;--card:#fff;--ink:#1b2a33;--mute:#5d6e78;--line:#d5dde2;--accent:#0f6b73;--accent-ink:#fff;
  --ok:#17794a;--ok-bg:#dff3e7;--bad:#b3322d;--bad-bg:#fbe3e1;--wait:#6b5a12;--wait-bg:#f6efc9;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12191d;--card:#1b262c;--ink:#e6edf0;--mute:#93a5ae;--line:#2c3b43;--accent:#4fb7bf;--accent-ink:#0c1a1d;
  --ok:#6fd49b;--ok-bg:#183a29;--bad:#ff938d;--bad-bg:#42201e;--wait:#e8d377;--wait-bg:#3a3414;}}
:root[data-theme="dark"]{--bg:#12191d;--card:#1b262c;--ink:#e6edf0;--mute:#93a5ae;--line:#2c3b43;--accent:#4fb7bf;--accent-ink:#0c1a1d;--ok:#6fd49b;--ok-bg:#183a29;--bad:#ff938d;--bad-bg:#42201e;--wait:#e8d377;--wait-bg:#3a3414}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 2px;font-weight:700}
.sub{color:var(--mute);margin:0 0 18px}
.grid{display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:1000px){.grid{grid-template-columns:540px 1fr;align-items:start}.form-card{position:sticky;top:16px}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.tabs{display:flex;gap:6px;margin-bottom:14px;background:var(--bg);padding:4px;border-radius:10px}
.tabs button{flex:1;border:0;background:transparent;color:var(--mute);padding:9px 6px;border-radius:7px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
label{display:block;font-weight:600;font-size:13px;margin:12px 0 5px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:84px;resize:vertical}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:90px;padding:9px 8px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.seg button[aria-pressed="true"][data-v="valid"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.seg button[aria-pressed="true"][data-v="tidak"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.seg button[aria-pressed="true"][data-v="belum"]{background:var(--wait-bg);border-color:var(--wait);color:var(--wait)}
.lt{overflow:auto}.lst{max-height:420px}
.tbl{width:100%;min-width:430px;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--mute);font-weight:600;padding:6px;border-bottom:1px solid var(--line)}
.tbl td{padding:3px;border-bottom:1px solid var(--line);vertical-align:middle}
.lst td{padding:6px}
.tbl td.no{width:32px;text-align:right;color:var(--mute);padding-right:6px}
.tbl input{padding:7px 8px;border-radius:6px}
.st{width:100%;min-width:84px;border:1px solid var(--line);border-radius:6px;padding:6px 4px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.st[data-v="valid"]{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.st[data-v="tidak"]{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.st[data-v="belum"]{background:var(--wait-bg);border-color:var(--wait);color:var(--wait)}
.x{background:none;border:0;color:var(--mute);cursor:pointer;font-size:18px;padding:2px 8px}
.addrow{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.addrow .btn{padding:7px 12px;font-size:13px}
.hint{font-size:12.5px;color:var(--mute);margin-top:8px}
.actions{display:flex;gap:8px;margin-top:16px;align-items:center}
.actions .primary{flex:none}
.saved{flex:1;color:var(--mute);font-size:13px}.saved.on{color:var(--ok)}
.note.aktif{box-shadow:0 0 0 2px var(--accent)}
.btn{border:0;border-radius:8px;padding:10px 16px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.primary{background:var(--accent);color:var(--accent-ink);flex:1}
.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tools input{flex:1;min-width:160px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--mute);border-radius:99px;padding:5px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.note{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:13px 14px;margin-bottom:10px}
.note[data-t="kerja"]{border-left-color:var(--mute)}
.note[data-t="cek"]{border-left-color:var(--accent)}
.note[data-t="rapat"]{border-left-color:var(--wait)}
.note h3{margin:0;font-size:16px;font-weight:600}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--mute);font-size:12.5px;margin-bottom:6px}
.badge{padding:2px 9px;border-radius:99px;font-weight:600;font-size:12px}
.b-valid{background:var(--ok-bg);color:var(--ok)}.b-tidak{background:var(--bad-bg);color:var(--bad)}.b-belum{background:var(--wait-bg);color:var(--wait)}
.b-type{background:var(--bg);color:var(--mute)}
.field{margin-top:8px}.field b{display:block;font-size:12.5px;color:var(--mute);font-weight:600}
.field p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.nact{display:flex;gap:14px;margin-top:10px}
.nact button{background:none;border:0;padding:0;color:var(--accent);font:600 13px inherit;font-family:inherit;cursor:pointer}
.nact .del{color:var(--bad)}
.empty{text-align:center;color:var(--mute);padding:36px 12px;border:1px dashed var(--line);border-radius:10px}
.hide{display:none}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Catatan Kerja</h1>
  <p class="sub">Catat pekerjaan, hasil pengecekan, dan rapat di satu tempat.</p>
  <div class="grid">
    <section class="card form-card" aria-label="Form catatan">
      <div class="tabs" id="tabs">
        <button type="button" data-t="kerja" aria-pressed="true">Pekerjaan</button>
        <button type="button" data-t="cek" aria-pressed="false">Pengecekan</button>
        <button type="button" data-t="rapat" aria-pressed="false">Rapat</button>
      </div>
      <label for="judul" style="margin-top:0">Judul</label>
      <input id="judul" placeholder="Contoh: Rekap surat masuk">
      <div class="row">
        <div><label for="tgl">Tanggal</label><input id="tgl" type="date"></div>
        <div class="f-rapat hide"><label for="peserta">Peserta</label><input id="peserta" placeholder="Nama, nama"></div>
      </div>
      <div class="f-cek hide">
        <label>Hasil pengecekan</label>
        <div class="lt"><table class="tbl"><thead><tr><th></th><th>Uraian</th><th>Status</th><th>Keterangan</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
        <div class="addrow"><button class="btn ghost" id="add1" type="button">+ Baris</button><button class="btn ghost" id="add10" type="button">+ 10 baris</button></div>
        <div class="hint">Klik tombol status untuk mengganti (Belum, Valid, Tidak valid). Salin kolom dari Excel lalu tempel di kolom Uraian, baris terisi otomatis.</div>
      </div>
      <div class="f-rapat hide">
        <label for="agenda">Agenda</label>
        <input id="agenda" placeholder="Topik yang dibahas">
      </div>
      <label for="isi" id="isiLabel">Catatan</label>
      <textarea id="isi" placeholder="Tulis catatan di sini"></textarea>
      <div class="f-rapat hide">
        <label for="tindak">Keputusan dan tindak lanjut</label>
        <textarea id="tindak" placeholder="Siapa mengerjakan apa, sampai kapan"></textarea>
      </div>
      <div class="actions">
        <span class="saved" id="saved" role="status">Tersimpan otomatis</span>
        <button class="btn primary" id="baru" type="button">+ Catatan baru</button>
      </div>
    </section>

    <section aria-label="Daftar catatan">
      <div class="tools"><input id="cari" type="search" placeholder="Cari catatan" aria-label="Cari catatan"></div>
      <div class="chips" id="chips">
        <button type="button" data-f="semua" aria-pressed="true">Semua</button>
        <button type="button" data-f="kerja" aria-pressed="false">Pekerjaan</button>
        <button type="button" data-f="cek" aria-pressed="false">Pengecekan</button>
        <button type="button" data-f="rapat" aria-pressed="false">Rapat</button>
      </div>
      <div id="list"></div>
    </section>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var KEY="catatan-kerja-v1", notes=[], tipe="kerja", rows=[], filter="semua", editId=null;
  var NAMA={kerja:"Pekerjaan",cek:"Pengecekan",rapat:"Rapat"};
  var LBL={valid:"Valid",tidak:"Tidak valid",belum:"Belum dicek"};
  var $=function(id){return document.getElementById(id)};

  function load(){try{var r=localStorage.getItem(KEY);notes=r?JSON.parse(r):[]}catch(e){notes=[]}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify(notes))}catch(e){toast("Penyimpanan browser tidak tersedia")}}
  function toast(t){var el=$("toast");el.textContent=t;el.classList.add("show");setTimeout(function(){el.classList.remove("show")},1800)}
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function fmt(s){if(!s)return"";var p=s.split("-");var b=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];return +p[2]+" "+b[+p[1]-1]+" "+p[0]}

  function setTipe(t){
    tipe=t;
    [].forEach.call($("tabs").children,function(b){b.setAttribute("aria-pressed",b.dataset.t===t)});
    [].forEach.call(document.querySelectorAll(".f-cek"),function(e){e.classList.toggle("hide",t!=="cek")});
    [].forEach.call(document.querySelectorAll(".f-rapat"),function(e){e.classList.toggle("hide",t!=="rapat")});
    $("isiLabel").textContent=t==="rapat"?"Pembahasan":t==="cek"?"Catatan tambahan":"Catatan";
    if(t==="cek"&&!rows.length)addRows(5);
  }
  var ORDER=["belum","valid","tidak"], SHORT={belum:"Belum",valid:"Valid",tidak:"Tidak valid"};
  function nextSt(v){return ORDER[(ORDER.indexOf(v)+1)%3]}
  function newRow(u,k){return {u:u||"",s:"belum",k:k||""}}
  function addRows(n){for(var i=0;i<n;i++)rows.push(newRow());drawRows()}
  function drawRows(focusIdx){
    var tb=$("rows");tb.textContent="";
    rows.forEach(function(r,i){
      var tr=document.createElement("tr");
      tr.appendChild(el("td","no",String(i+1)));
      var t1=document.createElement("td"),u=document.createElement("input");
      u.value=r.u;u.setAttribute("aria-label","Uraian baris "+(i+1));
      u.oninput=function(){r.u=u.value};
      u.onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();if(i===rows.length-1)rows.push(newRow());drawRows(i+1)}};
      u.onpaste=function(e){
        var t=(e.clipboardData||window.clipboardData).getData("text");
        if(t.indexOf("\n")<0)return;
        e.preventDefault();
        var lines=t.replace(/\r/g,"").split("\n");if(lines[lines.length-1]==="")lines.pop();
        var empty=!r.u;
        lines.map(function(l){return l.split("\t")}).forEach(function(p,j){
          if(j===0&&empty){r.u=p[0]||"";if(p[1])r.k=p[1]}
          else rows.splice(i+(empty?j:j+1),0,newRow(p[0],p[1]));
        });
        drawRows();
      };
      t1.appendChild(u);tr.appendChild(t1);
      var t2=document.createElement("td"),s=el("button","st",SHORT[r.s]);
      s.type="button";s.dataset.v=r.s;
      s.onclick=function(){r.s=nextSt(r.s);s.dataset.v=r.s;s.textContent=SHORT[r.s]};
      t2.appendChild(s);tr.appendChild(t2);
      var t3=document.createElement("td"),k=document.createElement("input");
      k.value=r.k;k.setAttribute("aria-label","Keterangan baris "+(i+1));k.oninput=function(){r.k=k.value};
      t3.appendChild(k);tr.appendChild(t3);
      var t4=document.createElement("td"),x=el("button","x","\u00d7");
      x.type="button";x.setAttribute("aria-label","Hapus baris "+(i+1));
      x.onclick=function(){rows.splice(i,1);drawRows()};
      t4.appendChild(x);tr.appendChild(t4);tb.appendChild(tr);
    });
    if(focusIdx!=null&&tb.children[focusIdx]){tb.children[focusIdx].querySelector("input").focus()}
  }

  function reset(){
    editId=null;["judul","isi","peserta","agenda","tindak"].forEach(function(i){$(i).value=""});
    $("tgl").value=today();rows=[];addRows(5);$("saved").textContent="Tersimpan otomatis";$("saved").classList.remove("on");
  }

  var timer=null;
  function schedule(){var s=$("saved");s.textContent="Menyimpan...";s.classList.remove("on");clearTimeout(timer);timer=setTimeout(simpan,400)}
  function flash(){var s=$("saved");s.textContent="Tersimpan otomatis";s.classList.add("on")}
  function simpan(){
    var judul=$("judul").value.trim();
    var kosong=!judul&&!$("isi").value.trim()&&!$("peserta").value.trim()&&!$("agenda").value.trim()&&!$("tindak").value.trim()&&!rows.some(function(r){return r.u.trim()||r.k.trim()||r.s!=="belum"});
    if(kosong&&!editId){$("saved").textContent="Tersimpan otomatis";$("saved").classList.remove("on");return}
    var n={id:editId||String(Date.now()),tipe:tipe,judul:judul,tgl:$("tgl").value||today(),isi:$("isi").value.trim(),
      status:"",rows:rows.filter(function(r){return r.u.trim()||r.k.trim()}).map(function(r){return{u:r.u.trim(),s:r.s,k:r.k.trim()}}),peserta:$("peserta").value.trim(),
      agenda:$("agenda").value.trim(),tindak:$("tindak").value.trim(),
      dibuat:Date.now()};
    if(editId){notes=notes.map(function(x){if(x.id===editId){n.dibuat=x.dibuat;return n}return x})}
    else{notes.unshift(n);editId=n.id}
    save();var y=window.scrollY;render();window.scrollTo(0,y);flash();
  }

  function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
  function field(label,val){if(!val)return null;var d=el("div","field");d.appendChild(el("b",null,label));d.appendChild(el("p",null,val));return d}

  function listTable(n){
    var w=el("div","lt lst field"),t=el("table","tbl"),h=document.createElement("tr");
    ["No","Uraian","Status","Keterangan"].forEach(function(x){h.appendChild(el("th",null,x))});
    var hd=document.createElement("thead");hd.appendChild(h);t.appendChild(hd);
    var tb=document.createElement("tbody");
    n.rows.forEach(function(r,i){
      var tr=document.createElement("tr");
      tr.appendChild(el("td","no",String(i+1)));tr.appendChild(el("td",null,r.u));
      var td=document.createElement("td"),b=el("button","st",SHORT[r.s]);
      b.type="button";b.dataset.v=r.s;b.title="Klik untuk ganti status";
      b.onclick=function(){r.s=nextSt(r.s);save();var y=window.scrollY;render();window.scrollTo(0,y)};
      td.appendChild(b);tr.appendChild(td);tr.appendChild(el("td",null,r.k));tb.appendChild(tr);
    });
    t.appendChild(tb);w.appendChild(t);return w;
  }

  function render(){
    var q=$("cari").value.toLowerCase().trim(), box=$("list");
    box.textContent="";
    var rows=notes.filter(function(n){
      if(filter!=="semua"&&n.tipe!==filter)return false;
      if(!q)return true;
      return [n.judul,n.isi,n.peserta,n.agenda,n.tindak,(n.rows||[]).map(function(r){return r.u+" "+r.k}).join(" ")].join(" ").toLowerCase().indexOf(q)>-1;
    }).sort(function(a,b){return a.tgl<b.tgl?1:a.tgl>b.tgl?-1:b.dibuat-a.dibuat});
    if(!rows.length){
      box.appendChild(el("div","empty",notes.length?"Tidak ada catatan yang cocok.":"Belum ada catatan. Isi form lalu pilih Simpan catatan."));return;
    }
    rows.forEach(function(n){
      var c=el("article","note");c.dataset.t=n.tipe;if(n.id===editId)c.classList.add("aktif");
      var m=el("div","meta");
      m.appendChild(el("span","badge b-type",NAMA[n.tipe]));
      if(n.tipe==="cek"&&n.rows&&n.rows.length){
        var cn={valid:0,tidak:0,belum:0};n.rows.forEach(function(r){cn[r.s]++});
        if(cn.valid)m.appendChild(el("span","badge b-valid",cn.valid+" valid"));
        if(cn.tidak)m.appendChild(el("span","badge b-tidak",cn.tidak+" tidak valid"));
        if(cn.belum)m.appendChild(el("span","badge b-belum",cn.belum+" belum dicek"));
      } else if(n.tipe==="cek"&&n.status)m.appendChild(el("span","badge b-"+n.status,LBL[n.status]));
      m.appendChild(el("span",null,fmt(n.tgl)));
      c.appendChild(m);c.appendChild(el("h3",null,n.judul||"(Tanpa judul)"));
      [n.tipe==="cek"&&n.rows&&n.rows.length?listTable(n):null,field("Peserta",n.peserta),field("Agenda",n.agenda),
       field(n.tipe==="rapat"?"Pembahasan":n.tipe==="cek"?(n.rows&&n.rows.length?"Catatan tambahan":"Hasil pengecekan"):"Catatan",n.isi),
       field("Keputusan dan tindak lanjut",n.tindak)].forEach(function(f){if(f)c.appendChild(f)});
      var a=el("div","nact");
      var e=el("button",null,"Ubah");e.type="button";e.onclick=function(){edit(n.id)};
      var d=el("button","del","Hapus");d.type="button";d.onclick=function(){hapus(n.id)};
      a.appendChild(e);a.appendChild(d);c.appendChild(a);box.appendChild(c);
    });
  }

  function edit(id){
    var n=notes.filter(function(x){return x.id===id})[0];if(!n)return;
    clearTimeout(timer);simpan();editId=id;setTipe(n.tipe);
    $("judul").value=n.judul;$("tgl").value=n.tgl;$("isi").value=n.isi;
    $("peserta").value=n.peserta;$("agenda").value=n.agenda;$("tindak").value=n.tindak;
    rows=(n.rows||[]).map(function(r){return{u:r.u,s:r.s,k:r.k}});
    if(n.tipe==="cek"&&!rows.length)addRows(5);else drawRows();
    $("saved").textContent="Tersimpan otomatis";$("saved").classList.remove("on");
    window.scrollTo({top:0,behavior:"smooth"});$("judul").focus();render();
  }
  function hapus(id){
    if(!confirm("Hapus catatan ini? Tindakan ini tidak bisa dibatalkan."))return;
    notes=notes.filter(function(x){return x.id!==id});save();
    if(editId===id)reset();toast("Catatan dihapus");render();
  }

  $("tabs").addEventListener("click",function(e){if(e.target.dataset.t)setTipe(e.target.dataset.t)});
  $("add1").onclick=function(){rows.push(newRow());drawRows(rows.length-1)};
  $("add10").onclick=function(){addRows(10)};
  $("chips").addEventListener("click",function(e){
    if(!e.target.dataset.f)return;filter=e.target.dataset.f;
    [].forEach.call($("chips").children,function(b){b.setAttribute("aria-pressed",b.dataset.f===filter)});render();
  });
  $("baru").onclick=function(){clearTimeout(timer);simpan();reset();render();$("judul").focus()};
  var fc=document.querySelector(".form-card");
  ["input","change","click","paste","keydown"].forEach(function(ev){fc.addEventListener(ev,function(e){
    if(e.target.id==="baru")return;
    if(e.type==="click"&&!e.target.closest("button"))return;
    if(e.type==="keydown"&&e.key!=="Enter")return;
    schedule();
  })});
  window.addEventListener("pagehide",function(){clearTimeout(timer);simpan()});
  document.addEventListener("visibilitychange",function(){if(document.hidden){clearTimeout(timer);simpan()}});
  $("cari").addEventListener("input",render);
  load();setTipe("kerja");reset();render();
})();
</script>
</body>
</html>
