<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator Plus</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap');

  :root {
    --ink: #1c1b19;
    --body-metal: #2b2926;
    --body-metal-light: #37342f;
    --display-bg: #14130f;
    --display-glow: #ffb454;
    --paper: #f3ecda;
    --paper-shadow: #d9cfb4;
    --accent: #e8952f;
    --accent-dim: #a8672099;
    --key-num: #45423c;
    --key-num-light: #4f4b44;
    --key-func: #55524a;
    --key-text: #efe8d8;
    --muted: #8c8778;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(circle at 20% -10%, #3a3630 0%, transparent 45%),
      var(--ink);
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 16px;
    color: var(--key-text);
  }

  .rig {
    display: flex;
    align-items: flex-end;
    gap: 0;
    position: relative;
  }

  /* ===== Paper tape (history) ===== */
  .tape-wrap {
    width: 220px;
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-right: -14px;
    z-index: 1;
  }

  .tape-slot {
    width: 180px;
    height: 18px;
    background: #0c0b09;
    border-radius: 4px;
    box-shadow: inset 0 3px 6px rgba(0,0,0,0.6);
    margin-bottom: -2px;
  }

  .tape {
    width: 190px;
    max-height: 480px;
    background: var(--paper);
    color: #3a3527;
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    padding: 18px 14px 24px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.35), inset 0 0 0 1px var(--paper-shadow);
    overflow-y: auto;
    position: relative;
    clip-path: polygon(
      0% 0%, 100% 0%, 100% 96%,
      92% 100%, 84% 96%, 76% 100%, 68% 96%, 60% 100%,
      52% 96%, 44% 100%, 36% 96%, 28% 100%, 20% 96%,
      12% 100%, 4% 96%, 0% 100%
    );
  }

  .tape::-webkit-scrollbar { width: 6px; }
  .tape::-webkit-scrollbar-thumb { background: var(--paper-shadow); border-radius: 3px; }

  .tape-title {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #8a8168;
    text-align: center;
    margin-bottom: 12px;
    border-bottom: 1px dashed var(--paper-shadow);
    padding-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .clear-history-btn {
    background: transparent;
    border: 1px solid var(--paper-shadow);
    color: #a89a76;
    font-family: 'Inter', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .clear-history-btn:hover { border-color: var(--accent); color: var(--accent); }

  .tape-empty {
    color: #b0a888;
    text-align: center;
    font-style: italic;
    font-size: 11px;
    margin-top: 12px;
  }

  .tape-entry {
    margin-bottom: 10px;
    line-height: 1.4;
    animation: printIn 0.25s ease;
  }
  .tape-entry .expr { color: #7d7660; font-size: 11px; }
  .tape-entry .res { font-weight: 700; font-size: 14px; color: #241f0f; }
  .tape-entry .res::before { content: '= '; color: var(--accent); }

  .tape-session {
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px dashed var(--paper-shadow);
    animation: printIn 0.25s ease;
  }
  .tape-session:last-child { border-bottom: none; }

  .tape-line {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: #4a442f;
    padding: 1px 0;
  }
  .tape-line .num {
    width: 20px;
    flex: none;
    text-align: left;
    font-size: 10px;
    color: #a89a76;
    align-self: center;
  }
  .tape-line .sign {
    color: var(--accent);
    width: 16px;
    font-weight: 700;
  }
  .tape-line .val { text-align: right; flex: 1; }

  .tape-rule {
    border-top: 1px solid #4a442f;
    margin: 6px 0 4px;
  }

  .tape-total {
    display: flex;
    justify-content: space-between;
    font-weight: 700;
    font-size: 15px;
    color: #241f0f;
  }
  .tape-total .label {
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #8a8168;
    align-self: center;
  }

  @keyframes printIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== Calculator body ===== */
  .calc {
    width: 320px;
    background: linear-gradient(160deg, var(--body-metal-light), var(--body-metal));
    border-radius: 22px;
    padding: 22px;
    box-shadow:
      0 24px 50px rgba(0,0,0,0.55),
      inset 0 1px 0 rgba(255,255,255,0.06),
      inset 0 -1px 0 rgba(0,0,0,0.4);
    position: relative;
    z-index: 2;
  }

  .brand {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
    padding: 0 2px;
  }
  .brand .name {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--muted);
  }
  .brand .plus { color: var(--accent); }
  .brand .model {
    font-size: 9px;
    color: #5f5b52;
    letter-spacing: 0.1em;
  }

  .screen {
    background: var(--display-bg);
    border-radius: 12px;
    padding: 18px 16px 14px;
    margin-bottom: 16px;
    box-shadow: inset 0 3px 10px rgba(0,0,0,0.7), inset 0 0 0 1px #000;
    position: relative;
    overflow: hidden;
  }

  .screen::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      0deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events: none;
  }

  .expr-line {
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    color: #8a7350;
    min-height: 16px;
    text-align: right;
    letter-spacing: 0.02em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-line {
    font-family: 'Space Mono', monospace;
    font-size: 40px;
    font-weight: 700;
    text-align: right;
    color: var(--display-glow);
    text-shadow: 0 0 12px rgba(255,180,84,0.45);
    margin-top: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    transition: transform 0.08s ease;
  }
  .result-line.pulse { transform: scale(1.03); }

  .screen-tools {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 8px;
  }

  .copy-btn {
    background: transparent;
    border: 1px solid #3d372a;
    color: #a89a76;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    padding: 5px 10px;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .copy-btn.copied { border-color: #6fbf73; color: #6fbf73; }

  /* ===== Keypad ===== */
  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button.key {
    border: none;
    border-radius: 10px;
    height: 54px;
    font-family: 'Space Mono', monospace;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    color: var(--key-text);
    background: var(--key-num);
    box-shadow: 0 3px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.06s ease, box-shadow 0.06s ease, background 0.15s ease;
  }
  button.key:hover { background: var(--key-num-light); }
  button.key:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.05);
  }

  button.key.func {
    background: var(--key-func);
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: #f0ead9;
  }
  button.key.func:hover { background: #625e54; }

  button.key.op {
    background: transparent;
    color: var(--accent);
    border: 1.5px solid var(--accent-dim);
    box-shadow: none;
  }
  button.key.op:hover { background: rgba(232,149,47,0.1); }
  button.key.op:active { transform: translateY(2px); }

  button.key.equals {
    background: var(--accent);
    color: #1c1204;
    grid-column: span 2;
    box-shadow: 0 3px 0 #a8672099, inset 0 1px 0 rgba(255,255,255,0.25);
  }
  button.key.equals:hover { background: #f0a13f; }
  button.key.equals:active {
    transform: translateY(2px);
    box-shadow: 0 1px 0 #a8672099;
  }

  button.key.zero { grid-column: span 2; }

  @media (max-width: 560px) {
    .rig { flex-direction: column-reverse; align-items: center; }
    .tape-wrap { margin-right: 0; margin-top: -10px; order: 2; }
    .tape { width: 260px; }
    .calc { width: min(92vw, 360px); }
  }
</style>
</head>
<body>

<div class="rig">
  <div class="tape-wrap">
    <div class="tape-slot"></div>
    <div class="tape" id="tape">
      <div class="tape-title">
        Riwayat
        <button class="clear-history-btn" id="clearHistoryBtn" title="Hapus riwayat">Hapus</button>
      </div>
      <div class="tape-empty" id="tapeEmpty">Belum ada perhitungan</div>
    </div>
  </div>

  <div class="calc">
    <div class="brand">
      <span class="name">CALCULATOR<span class="plus">+</span></span>
      <span class="model">Vallery</span>
    </div>

    <div class="screen">
      <div class="expr-line" id="exprLine">&nbsp;</div>
      <div class="result-line" id="resultLine">0</div>
      <div class="screen-tools">
        <button class="copy-btn" id="copyBtn">Salin</button>
      </div>
    </div>

    <div class="keypad">
      <button class="key func" data-action="clear">C</button>
      <button class="key func" data-action="backspace">⌫</button>
      <button class="key func" data-action="percent">%</button>
      <button class="key op" data-action="op" data-op="÷">÷</button>

      <button class="key" data-digit="7">7</button>
      <button class="key" data-digit="8">8</button>
      <button class="key" data-digit="9">9</button>
      <button class="key op" data-action="op" data-op="×">×</button>

      <button class="key" data-digit="4">4</button>
      <button class="key" data-digit="5">5</button>
      <button class="key" data-digit="6">6</button>
      <button class="key op" data-action="op" data-op="−">−</button>

      <button class="key" data-digit="1">1</button>
      <button class="key" data-digit="2">2</button>
      <button class="key" data-digit="3">3</button>
      <button class="key op" data-action="op" data-op="+">+</button>

      <button class="key zero" data-digit="0">0</button>
      <button class="key" data-digit=".">.</button>
      <button class="key equals" data-action="equals">=</button>
    </div>
  </div>
</div>

<script>
  const exprLine = document.getElementById('exprLine');
  const resultLine = document.getElementById('resultLine');
  const tape = document.getElementById('tape');
  const tapeEmpty = document.getElementById('tapeEmpty');
  const copyBtn = document.getElementById('copyBtn');

  let current = '0';
  let previous = null;
  let operator = null;
  let justEvaluated = false;
  let entries = []; // { sign: null|'+'|'−'|'×'|'÷', value: string }

  const STORAGE_KEY = 'calculatorPlusHistory';
  const opMap = { '÷': (a,b) => a / b, '×': (a,b) => a * b, '−': (a,b) => a - b, '+': (a,b) => a + b };

  function loadHistory() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function saveHistory(history) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(history));
    } catch (e) {
      console.error('Gagal menyimpan riwayat:', e);
    }
  }

  function renderTapeSession(sessionEntries, total) {
    tapeEmpty.style.display = 'none';
    const session = document.createElement('div');
    session.className = 'tape-session';

    let linesHtml = '';
    sessionEntries.forEach((e, i) => {
      const signHtml = e.sign ? `<span class="sign">${e.sign}</span>` : `<span class="sign"></span>`;
      linesHtml += `<div class="tape-line"><span class="num">${i + 1}</span>${signHtml}<span class="val">${e.value}</span></div>`;
    });

    session.innerHTML = `
      ${linesHtml}
      <div class="tape-rule"></div>
      <div class="tape-total"><span class="label" style="padding-left:20px">Total</span><span class="val">${total}</span></div>
    `;
    tape.appendChild(session);
    return session;
  }

  function renderHistoryFromStorage() {
    const history = loadHistory();
    if (history.length > 0) tapeEmpty.style.display = 'none';
    history.forEach(item => renderTapeSession(item.entries, item.total));
    tape.scrollTop = tape.scrollHeight;
  }

  function formatNumber(n) {
    if (!isFinite(n)) return 'Error';
    let s = parseFloat(n.toFixed(10)).toString();
    if (s.length > 14) s = Number(n).toExponential(6);
    return s;
  }

  function updateDisplay() {
    resultLine.textContent = current;
    exprLine.textContent = previous !== null && operator
      ? `${formatNumber(previous)} ${operator}`
      : '\u00A0';
  }

  function pulse() {
    resultLine.classList.remove('pulse');
    void resultLine.offsetWidth;
    resultLine.classList.add('pulse');
  }

  function inputDigit(d) {
    if (justEvaluated) {
      current = d === '.' ? '0.' : d;
      justEvaluated = false;
      updateDisplay();
      return;
    }
    if (d === '.' && current.includes('.')) return;
    if (current === '0' && d !== '.') current = d;
    else current += d;
    updateDisplay();
  }

  function chooseOperator(op) {
    if (justEvaluated) {
      // lanjut menghitung dari hasil sebelumnya sebagai entri pertama sesi baru
      entries = [{ sign: null, value: current }];
      previous = parseFloat(current);
      justEvaluated = false;
    } else if (operator === null) {
      // ini operator pertama pada sesi ini -> catat angka pertama
      entries.push({ sign: null, value: current });
      previous = parseFloat(current);
    } else {
      // gabungkan angka sebelumnya, lalu catat angka yang baru selesai diketik
      entries.push({ sign: operator, value: current });
      previous = opMap[operator](previous, parseFloat(current));
    }
    operator = op;
    current = '0';
    updateDisplay();
  }

  function evaluate(addToTape = true) {
    if (operator === null || previous === null) return;
    entries.push({ sign: operator, value: current });
    const total = opMap[operator](previous, parseFloat(current));
    const resultStr = formatNumber(total);

    if (addToTape) {
      addTapeSession(entries, resultStr);
    }

    current = resultStr;
    previous = null;
    operator = null;
    entries = [];
    justEvaluated = true;
    updateDisplay();
    pulse();
  }

  function clearAll() {
    current = '0';
    previous = null;
    operator = null;
    entries = [];
    justEvaluated = false;
    updateDisplay();
  }

  function backspace() {
    if (justEvaluated) { clearAll(); return; }
    current = current.length > 1 ? current.slice(0, -1) : '0';
    updateDisplay();
  }

  function percent() {
    current = formatNumber(parseFloat(current) / 100);
    updateDisplay();
  }

  function addTapeSession(sessionEntries, total) {
    renderTapeSession(sessionEntries, total);
    tape.scrollTop = tape.scrollHeight;

    const history = loadHistory();
    history.push({ entries: sessionEntries, total });
    saveHistory(history);
  }

  function clearHistory() {
    saveHistory([]);
    tape.querySelectorAll('.tape-session').forEach(el => el.remove());
    tapeEmpty.style.display = '';
  }

  document.querySelectorAll('[data-digit]').forEach(btn => {
    btn.addEventListener('click', () => inputDigit(btn.dataset.digit));
  });

  document.querySelectorAll('[data-action="op"]').forEach(btn => {
    btn.addEventListener('click', () => chooseOperator(btn.dataset.op));
  });

  document.querySelector('[data-action="equals"]').addEventListener('click', () => evaluate(true));
  document.querySelector('[data-action="clear"]').addEventListener('click', clearAll);
  document.querySelector('[data-action="backspace"]').addEventListener('click', backspace);
  document.querySelector('[data-action="percent"]').addEventListener('click', percent);

  document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    if (confirm('Hapus semua riwayat perhitungan?')) clearHistory();
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(current);
      copyBtn.textContent = 'Tersalin!';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Salin';
        copyBtn.classList.remove('copied');
      }, 1200);
    } catch (e) {
      copyBtn.textContent = 'Gagal';
      setTimeout(() => { copyBtn.textContent = 'Salin'; }, 1200);
    }
  });

  // Keyboard support
  window.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') inputDigit(e.key);
    else if (e.key === '.') inputDigit('.');
    else if (e.key === '+') chooseOperator('+');
    else if (e.key === '-') chooseOperator('−');
    else if (e.key === '*') chooseOperator('×');
    else if (e.key === '/') { e.preventDefault(); chooseOperator('÷'); }
    else if (e.key === 'Enter' || e.key === '=') evaluate(true);
    else if (e.key === 'Backspace') backspace();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '%') percent();
  });

  renderHistoryFromStorage();
  updateDisplay();
</script>

</body>
</html>
